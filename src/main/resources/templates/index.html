<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - Manteca SL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="/css/index.css">
</head>

<body>
    <div class="navbar">
        <div class="logo" onclick="window.location.href='/'">Manteca SL</div>

        <div class="right-menu">
            <!-- Botón Mis Propiedades (solo cuando hay usuario logueado) -->
            <a th:if="${usuario != null}" 
               href="/mis-propiedades" 
               class="menu-btn menu-btn-with-badge" 
               title="Mis propiedades">
                <i class="fa fa-home"></i>
                <span>Mis Propiedades</span>
            </a>

            <!-- Botón de Mensajes/Notificaciones (PARA TODOS LOS USUARIOS) -->
            <a th:if="${usuario != null}" 
               href="/notificaciones" 
               class="menu-btn menu-btn-with-badge messages-btn" 
               title="Mis notificaciones">
                <i class="fa fa-envelope"></i>
                <span>Mensajes</span>
                <th:block th:if="${notificacionesNoLeidas != null and notificacionesNoLeidas > 0}">
                    <span class="notification-badge messages-badge" th:text="${notificacionesNoLeidas}"></span>
                </th:block>
            </a>

            <!-- Botón de Notificaciones de Propietario (SOLO PARA PROPIETARIOS) -->
            <a th:if="${usuario != null and esPropietario}" 
               href="/propietario/notificaciones" 
               class="menu-btn menu-btn-with-badge notifications-btn" 
               title="Solicitudes de reserva">
                <i class="fa fa-bell"></i>
                <span>Solicitudes</span>
                <th:block th:if="${numeroNotificacionesPendientes != null and numeroNotificacionesPendientes > 0}">
                    <span class="notification-badge notifications-badge" th:text="${numeroNotificacionesPendientes}"></span>
                </th:block>
            </a>

            <!-- Botón de Favoritos -->
            <a href="/favoritos" 
               class="menu-btn menu-btn-with-badge favorites-btn"
               title="Favoritos">
                <i class="fa fa-heart"></i>
                <span>Favoritos</span>
            </a>

            <!-- Menu de usuario con dropdown -->
            <div th:if="${usuario != null}" class="user-dropdown">
                <div class="menu-btn menu-btn-with-badge user-settings-btn" style="cursor: pointer;">
                    <i class="fa fa-user"></i>
                    <span th:text="${usuario.nombre}">Usuario</span>
                    <i class="fa fa-chevron-down" style="font-size: 12px; margin-left: 5px;"></i>
                </div>
                <div class="dropdown-content">
                    <a th:href="@{/configuracion(idUsuario=${usuario.id})}" style="cursor: pointer;">
                        <i class="fa fa-cog"></i>
                        <span>Configuración</span>
                    </a>
                    <a href="/logout" style="cursor: pointer;">
                        <i class="fa fa-sign-out"></i>
                        <span>Cerrar sesión</span>
                    </a>
                </div>
            </div>

            <!-- Botón de login si no hay usuario -->
            <a th:if="${usuario == null}" href="/login" class="menu-btn menu-btn-with-badge login-btn">
                <i class="fa fa-user"></i>
                <span>Iniciar sesión</span>
            </a>
        </div>
    </div>

<div class="hero">
    <h1>Encuentra tu próximo alojamiento</h1>
    <p>Explora lugares únicos en todo el mundo con Manteca SL</p>

    <form action="/catalogo" method="get" class="search-box">
        <div class="search-item">
            <label>¿Dónde?</label>
            <input type="text" name="ciudad" placeholder="Destino, ciudad...">
        </div>

        <div class="search-item">
            <label>Entrada</label>
            <input type="date" name="fechaInicio">
        </div>

        <div class="search-item">
            <label>Salida</label>
            <input type="date" name="fechaFin">
        </div>

        <div class="search-item">
            <label>Huéspedes</label>
            <input type="number" name="capacidad" placeholder="1" min="1">
        </div>

        <button class="search-button" type="submit">Buscar</button>
    </form>

    <button class="btn-ver-catalogo" onclick="window.location.href='/catalogo'">
        Ver catálogo de alojamientos
    </button>
</div>

<script>
    // Establecer fecha mínima en los inputs de fecha
    document.addEventListener('DOMContentLoaded', function() {
        const today = new Date().toISOString().split('T')[0];
        const fechaInicio = document.querySelector('input[name="fechaInicio"]');
        const fechaFin = document.querySelector('input[name="fechaFin"]');
        
        if (fechaInicio) fechaInicio.min = today;
        if (fechaFin) fechaFin.min = today;
        
        // Actualizar fecha mínima de fin cuando cambia la de inicio
        if (fechaInicio && fechaFin) {
            fechaInicio.addEventListener('change', function() {
                fechaFin.min = this.value;
                if (fechaFin.value && fechaFin.value < this.value) {
                    fechaFin.value = this.value;
                }
            });
        }
    });
</script>

    <script>
        // User dropdown menu toggle
        const userDropdown = document.querySelector('.user-dropdown');
        const userMenu = document.querySelector('.user-dropdown .user-menu');
        const dropdownContent = document.querySelector('.dropdown-content');

        if (userMenu && dropdownContent) {
            // Click to toggle
            userMenu.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                userDropdown.classList.toggle('active');
            });

            // Click outside to close
            document.addEventListener('click', function(e) {
                if (!userDropdown || !userDropdown.contains(e.target)) {
                    if (userDropdown) {
                        userDropdown.classList.remove('active');
                    }
                }
            });

            // Close when clicking a dropdown link
            dropdownContent.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', function() {
                    userDropdown.classList.remove('active');
                });
            });
        }
    </script>
</body>
</html>
