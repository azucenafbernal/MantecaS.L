<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Propiedad</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 600px;
        }
        
        .card {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            padding: 25px 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .form-container {
            padding: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
            font-size: 14px;
        }
        
        .input-field {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            transition: all 0.3s;
        }
        
        .input-field:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.2);
            outline: none;
        }
        
        textarea.input-field {
            resize: vertical;
            min-height: 80px;
        }
        
        .btn-submit {
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 14px;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        
        .btn-submit:hover {
            background: linear-gradient(to right, #5a6fd8, #6a4190);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
            text-align: center;
        }
        
        .footer {
            text-align: center;
            padding: 20px;
            font-size: 14px;
            color: #666;
            border-top: 1px solid #eee;
        }
        
        .footer a {
            color: #667eea;
            text-decoration: none;
        }
        
        @media (max-width: 480px) {
            .container {
                max-width: 100%;
            }
            
            .form-container {
                padding: 20px;
            }
        }

        /* Phone Input Component Styles */
        .form-group .phone-input-box {
            display: flex !important;
            gap: 8px;
            align-items: center;
            flex-wrap: nowrap;
            width: 100%;
        }

        .prefix-dropdown-with-flag {
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background-color: white;
            cursor: pointer;
            font-size: 15px;
            white-space: nowrap;
            flex-shrink: 0 !important;
            width: auto;
            display: flex;
            align-items: center;
            transition: all 0.3s;
        }

        .prefix-dropdown-with-flag:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.2);
            outline: none;
        }

        #telefonoCompleto {
            flex: 1 1 auto !important;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            width: auto;
            box-sizing: border-box;
            transition: all 0.3s;
        }

        #telefonoCompleto:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.2);
            outline: none;
        }

        @media (max-width: 768px) {
            .form-group .phone-input-box {
                flex-wrap: wrap;
            }

            .prefix-dropdown-with-flag,
            #telefonoCompleto {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>Registro de Propiedad</h1>
                <p>Registra tu propiedad para empezar a alquilar</p>
            </div>
            
            <div class="form-container">
                <!-- Mensaje de error -->
                <div th:if="${error}" class="error" th:text="${error}"></div>
                
                <form th:action="@{/propiedades/registrar}" method="post">
                    <div class="form-group">
                        <label for="emailPropietario">Email del Usuario *</label>
                        <input type="email" id="emailPropietario" name="emailPropietario" 
                            class="input-field" placeholder="usuario@ejemplo.com" required>
                    </div>

                    <!-- NUEVOS CAMPOS PARA DATOS DE PROPIETARIO -->
                    <div th:replace="~{components/phone-input :: phone-input}"></div>
                    <input type="hidden" id="telefonoConPrefijo" name="telefonoContacto">

                    <div class="form-group">
                        <label for="cuentaBancaria">Cuenta Bancaria (IBAN) *</label>
                        <input type="text" id="cuentaBancaria" name="cuentaBancaria" 
                            class="input-field" placeholder="ES12 3456 7890 1234 5678 9012" required>
                    </div>

                    <!-- DIRECCIÓN SEPARADA -->
                    <div class="form-group" style="display: flex; gap: 10px;">
                        <div style="flex: 2;">
                            <label for="calle">Calle *</label>
                            <input type="text" id="calle" name="calle"
                                class="input-field" placeholder="Ej: Avenida del Sol" required>
                        </div>

                        <div style="flex: 1;">
                            <label for="numero">Número *</label>
                            <input type="text" id="numero" name="numero"
                                class="input-field" placeholder="12B" required>
                        </div>
                    </div>

                    <div class="form-group" style="display: flex; gap: 10px;">
                        <div style="flex: 2;">
                            <label for="ciudad">Ciudad *</label>
                            <input type="text" id="ciudad" name="ciudad"
                                class="input-field" placeholder="Madrid" required>
                        </div>

                        <div style="flex: 1;">
                            <label for="codigoPostal">Código Postal *</label>
                            <input type="text" id="codigoPostal" name="codigoPostal"
                                class="input-field" placeholder="28080" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="precioNoche">Precio por Noche (€) *</label>
                        <input type="number" id="precioNoche" name="precioNoche" 
                               class="input-field" placeholder="50.00" step="0.01" min="0" required>
                    </div>

                    <div class="form-group">
                        <label for="capacidad">Capacidad (personas) *</label>
                        <input type="number" id="capacidad" name="capacidad" 
                               class="input-field" placeholder="4" min="1" required>
                    </div>

                    <div class="form-group">
                        <label for="descripcion">Descripción de la Propiedad</label>
                        <textarea id="descripcion" name="descripcion" 
                                  class="input-field" 
                                  placeholder="Describe tu propiedad, características, ambiente..."></textarea>
                    </div>

                    <button type="submit" class="btn-submit">Registrar Propiedad</button>
                </form>
            </div>
            
            <div class="footer">
                <a th:href="@{/propiedades}">Ver todas las propiedades</a> | 
                <a th:href="@{/}">Volver al inicio</a>
            </div>
        </div>
    </div>

    <script>
        // Capturar el número de teléfono con prefijo en el formulario de registro
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.querySelector('form');
            if (form) {
                form.addEventListener('submit', function(e) {
                    const fullPhone = window.getFullPhoneNumber ? window.getFullPhoneNumber() : '';
                    if (fullPhone) {
                        document.getElementById('telefonoConPrefijo').value = fullPhone;
                    }
                });
            }
        });
    </script>
</body>
</html>
