<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - MantecaS.L</title>
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>Iniciar Sesión</h1>
                <p>Ingresa con tu correo y contraseña</p>
            </div>

            <div class="form-container">
                <!-- Formulario Thymeleaf -->
                <form th:action="@{/login}" th:object="${usuario}" method="post">

                    <input type="hidden" th:name="from" th:value="${from}">
                    
                    <!-- Mensaje de error -->
                    <div th:if="${error}" class="error" th:text="${error}"></div>

                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" th:field="*{nombre}" class="input-field" placeholder="Tu nombre">
                    </div>

                    <div class="form-group">
                        <label for="email">Correo electrónico</label>
                        <input type="email" th:field="*{email}" class="input-field" placeholder="ejemplo@correo.com" required>
                    </div>

                    <div class="form-group">
                        <label for="contrasena">Contraseña</label>
                        <input type="password" th:field="*{contrasena}" class="input-field" placeholder="Tu contraseña" required>
                    </div>

                    <button type="submit" class="btn-submit">Iniciar Sesión</button>
                </form>
            </div>

            <div class="footer">
                ¿No tienes una cuenta? <a th:href="@{/usuarios}">Regístrate aquí</a> |
                <a th:href="@{/}">Volver al inicio</a>
            </div>
        </div>
    </div>
</body>
</html>
