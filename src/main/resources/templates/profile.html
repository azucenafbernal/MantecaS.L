<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario - MantecaS.L</title>
    <link rel="stylesheet" href="/css/profile.css">
</head>
<body>
<div class="container">
    <div class="card">
        <div class="header">
            <h1>Mi Perfil</h1>
        </div>
        <div class="section">
            <h2>Información del Usuario</h2>
            <div class="info-item">
                <span class="info-label">Nombre:</span>
                <a th:href="@{/configuracion(idUsuario=${usuario.id})}" class="info-value" style="color: #4a00e0; text-decoration: none; cursor: pointer; font-weight: 600;" th:text="${usuario.nombre}">Juan Pérez</a>
            </div>
            <div class="info-item">
                <span class="info-label">Email:</span>
                <span class="info-value" th:text="${usuario.email}">juan@correo.com</span>
            </div>

            <a th:href="@{/configuracion(idUsuario=${usuario.id})}" class="btn btn-primary">Configurar Cuenta</a>
            <a href="#" class="btn btn-secondary">Añadir Método de Autenticación</a>
        </div>

        <div class="section">
            <h2>Sesión</h2>
            <a th:href="@{/logout}" class="btn btn-secondary">Cerrar Sesión</a>
            <a th:href="@{/}" class="btn btn-primary">Volver al Inicio</a>
        </div>

        <div class="footer">
            &copy; 2025 MantecaS.L — Todos los derechos reservados.
        </div>
    </div>
</div>
</body>
</html>
