<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva Confirmada</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .confirmation-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
        }
        .success-icon {
            font-size: 4rem;
            color: #28a745;
        }
        .btn-primary-custom {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-weight: 600;
        }
        .btn-primary-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card confirmation-card text-center py-5">
                    <div class="card-body">
                        <!-- Icono de éxito -->
                        <div class="success-icon mb-4">✅</div>
                        
                        <!-- Mensaje de éxito -->
                        <h2 class="card-title mb-3" th:text="${mensaje}">¡Reserva Confirmada!</h2>
                        <p class="text-muted mb-4">Tu reserva ha sido procesada exitosamente</p>

                        <!-- Detalles de la reserva -->
                        <div th:if="${reserva}" class="bg-white rounded p-4 mb-4 text-start">
                            <h5 class="mb-3">📋 Detalles de tu reserva:</h5>
                            <div class="row">
                                <div class="col-md-6">
                                    <p><strong>🔢 ID de Reserva:</strong> <span th:text="${reserva.id}"></span></p>
                                    <p><strong>🏠 Inmueble:</strong> <span th:text="${inmueble.direccion}"></span></p>
                                    <p><strong>📅 Fecha de entrada:</strong> <span th:text="${reserva.fechaInicio}"></span></p>
                                </div>
                                <div class="col-md-6">
                                    <p><strong>📅 Fecha de salida:</strong> <span th:text="${reserva.fechaFin}"></span></p>
                                    <p><strong>💰 Precio total:</strong> €<span th:text="${#numbers.formatDecimal(reserva.precioTotal, 1, 2)}"></span></p>
                                    <p><strong>📊 Estado:</strong> <span th:text="${reserva.estado}"></span></p>
                                </div>
                            </div>
                        </div>

                        <!-- Botones de acción -->
                        <div class="d-flex justify-content-center gap-3 flex-wrap">
                            <a th:href="@{/}" class="btn btn-primary-custom text-white">
                                🏠 Volver al Inicio
                            </a>
                            <a th:href="@{/inmueble/{id}(id=${inmueble.id})}" class="btn btn-outline-secondary">
                                📋 Ver el Inmueble
                            </a>
                            <a th:href="@{/buscar}" class="btn btn-outline-primary">
                                🔍 Buscar Más Alojamientos
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
