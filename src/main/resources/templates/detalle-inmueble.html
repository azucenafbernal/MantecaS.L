<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Detalles de la propiedad: ' + ${inmueble.direccion}">Detalles</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: 
                linear-gradient(135deg, rgba(35, 54, 73, 0.85) 0%, rgba(38, 65, 99, 0.85) 100%),
                url('/images/fondoazul.jpg') center/cover no-repeat fixed;
            min-height: 100vh;
            padding: 20px;
            color: #9eaabe;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(52, 84, 110, 0.9);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            border: 1px solid rgba(116, 130, 150, 0.5);
            backdrop-filter: blur(10px);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity:0; transform:translateY(20px); }
            to   { opacity:1; transform:translateY(0); }
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
        }

        .title h1 {
            font-size: 32px;
            font-weight: 700;
            color: #a3b6dd;
            margin-bottom: 6px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .title p {
            font-size: 14px;
            color: #c1c9d6;
        }

        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .detail-item {
            background: rgba(197,205,218,0.1);
            padding: 18px;
            border-radius: 12px;
            border-left: 4px solid #4299e1;
        }

        .detail-item span {
            display: block;
            font-weight: 500;
            color: #c5cdda;
            margin-bottom: 5px;
        }

        .detail-item p {
            color: #e2e8f0;
            font-weight: 500;
        }

        .description {
            grid-column: 1 / -1;
            background: rgba(197,205,218,0.1);
            padding: 22px;
            border-radius: 12px;
            margin-top: 20px;
            border-left: 4px solid #4299e1;
        }

        .description h3 {
            margin-top: 0;
            color: #4299e1;
        }

        .buttons {
            text-align: center;
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #4299e1;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 22px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(66,153,225,0.3);
        }

        .btn:hover {
            background: #3182ce;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(66,153,225,0.4);
        }

        @media (max-width: 768px) {
            .details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">
            <h1 th:text="'Detalles de la propiedad: ' + ${inmueble.direccion}"></h1>
            <p>ID de propiedad: <span th:text="${inmueble.id}"></span></p>
        </div>

        <div class="details">
            <div class="detail-item">
                <span>📍 Dirección</span>
                <p th:text="${inmueble.direccion}">Dirección completa</p>
            </div>
            <div class="detail-item">
                <span>💰 Precio por noche</span>
                <p th:text="'€' + ${inmueble.precioNoche}">€50</p>
            </div>
            <div class="detail-item">
                <span>👥 Capacidad</span>
                <p th:text="${inmueble.capacidad} + ' personas'">4 personas</p>
            </div>
            <div class="detail-item">
                <span>👤 Propietario</span>
                <p th:text="${inmueble.propietario.usuario.nombre}">Juan Pérez</p>
            </div>
            <div class="detail-item">
                <span>📧 Email de contacto</span>
                <p th:text="${inmueble.propietario.usuario.email}">juan@ejemplo.com</p>
            </div>
        </div>

        <div class="description" th:if="${inmueble.descripcion}">
            <h3>📝 Descripción del inmueble</h3>
            <p th:text="${inmueble.descripcion}">Descripción detallada del inmueble.</p>
        </div>

        <div class="buttons">
            <a th:href="@{/catalogo}" class="btn">⬅ Volver al catálogo</a>
            <a th:href="@{/reservas/nueva/{id}(id=${inmueble.id}, fechaInicio=${fechaInicio}, fechaFin=${fechaFin})}" class="btn">🏠 Reservar Ahora</a>
        </div>
    </div>
</body>
</html>
