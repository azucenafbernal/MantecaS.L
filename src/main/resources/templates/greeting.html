<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuarios</title>
    <link rel="stylesheet" href="/css/greeting.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>Registro de Usuarios</h1>
                <p>Crea tu cuenta en pocos segundos</p>
            </div>

            <div class="form-container">
                <!-- Formulario Thymeleaf -->
                <form th:action="@{/usuarios}" th:object="${usuario}" method="post">
                    
                    <!-- Mensaje de error -->
                    <div th:if="${error}" class="error" th:text="${error}"></div>

                    <div class="form-group">
                        <label for="nombre">Nombre completo</label>
                        <input type="text" th:field="*{nombre}" class="input-field" placeholder="Ingresa tu nombre completo" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Correo electrónico</label>
                        <input type="email" th:field="*{email}" class="input-field" placeholder="ejemplo@correo.com" required>
                    </div>

                    <div class="form-group">
                        <label for="contrasena">Contraseña</label>
                        <input type="password" th:field="*{contrasena}" class="input-field" placeholder="Crea una contraseña segura" required>
                    </div>

                    <button type="submit" class="btn-submit">Crear Cuenta</button>
                </form>
            </div>

            <div class="footer">
                ¿Ya tienes una cuenta? <a href="/login">Inicia sesión aquí</a> |
                <a th:href="@{/}"> Volver al inicio</a>
            </div>
        </div>
    </div>
</body>
</html>
