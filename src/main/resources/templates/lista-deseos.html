<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Deseos</title>

    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 40px;
            font-size: 32px;
        }

        .properties-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
        }

        
        .property-card {
            background: #f4f6ff;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.45);
            box-shadow: 0 10px 30px rgba(0,0,0,0.20);
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .property-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 18px 40px rgba(0,0,0,0.30);
        }

        .property-header {
            background: linear-gradient(to right, #5b6ef2, #7e4fd6);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .property-content {
            padding: 20px;
            color: #1e1e1e;
        }

        .btn {
            display: inline-block;
            width: 100%;
            background: #ff4e4e;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.2s ease;
        }

        .btn:hover {
            background: #ff2e2e;
        }

        .empty-msg {
            color: white;
            text-align: center;
            margin-top: 80px;
            font-size: 22px;
        }

        .volver-btn {
            display: inline-block;
            background: white;
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: 700;
            text-decoration: none;
            color: #667eea;
            margin-top: 25px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.25);
            transition: all 0.3s ease;
        }

        .volver-btn:hover {
            transform: translateY(-3px);
            background: #f0f0ff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.35);
        }

    </style>
</head>

<body>
<div class="container">
    <h1>❤️ Mi Lista de Deseos</h1>

    <div th:if="${favoritos.isEmpty()}" class="empty-msg">
        No tienes propiedades en tu lista de deseos aún.
        <br><br>

        <div style="text-align: center;">
            <a class="volver-btn" th:href="@{/catalogo}">🏠 Volver al catálogo</a>
        </div>
    </div>

    <div th:unless="${favoritos.isEmpty()}" class="properties-grid">

        <div th:each="fav : ${favoritos}">
            
            
            <a th:href="@{/gestor/propiedad/{id}(id=${fav.inmueble.id})}" 
               class="property-card">

                <div class="property-header">
                    <h3 th:text="${fav.inmueble.direccion}"></h3>
                    <p th:text="|€${fav.inmueble.precioNoche}/noche|"></p>
                </div>

                <div class="property-content">
                    <p><strong>Capacidad:</strong>
                        <span th:text="${fav.inmueble.capacidad}"></span> personas
                    </p>

                    <p><strong>Propietario:</strong>
                        <span th:text="${fav.inmueble != null && fav.inmueble.usuario != null} ? 
                                      ${fav.inmueble.usuario.nombre} : 
                                      'Propietario no disponible'"></span>
                    </p>
                </div>
            </a>

            
            <form th:action="@{/favoritos/eliminar/{id}(id=${fav.id})}" method="post">
                <button type="submit" class="btn">🗑 Eliminar de Favoritos</button>
            </form>

        </div>

    </div>

    <div style="text-align: center;">
        <a class="volver-btn" th:href="@{/}">⬅️ Volver al inicio</a>
    </div>

</div>
</body>
</html>
