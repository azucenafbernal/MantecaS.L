<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Detalles de la propiedad en ' + ${inmueble.calle} + ' ' + ${inmueble.numero}">Detalles</title>
    <link rel="stylesheet" href="/css/resultado-propiedad.css">
</head>
<body>
    <div class="container">
        <div class="title">
            <h1 th:text="'Detalles de la propiedad en ' + ${inmueble.calle} + ' ' + ${inmueble.numero} + ', ' + ${inmueble.ciudad}">Detalles</h1>
            <p>ID de propiedad: <span th:text="${inmueble.id}"></span></p>
        </div>

        <div class="details">
            <div class="detail-item">
                <span>📍 Dirección:</span>
                <p th:text="${inmueble.calle} + ' ' + ${inmueble.numero} + ', ' + ${inmueble.ciudad} + ' ' + ${inmueble.codigoPostal}"></p>
            </div>
            <div class="detail-item">
                <span>💰 Precio por noche:</span>
                <p th:text="|€${inmueble.precioNoche}|"></p>
            </div>
            <div class="detail-item">
                <span>👥 Capacidad:</span>
                <p th:text="${inmueble.capacidad} + ' personas'"></p>
            </div>
            <div class="detail-item">
                <span>👤 Propietario:</span>
                <p th:text="${inmueble.usuario.nombre}"></p>
            </div>
            <div class="detail-item">
                <span>📧 Email de contacto:</span>
                <p th:text="${inmueble.usuario.email}"></p>
            </div>
        </div>

        <div class="description" th:if="${inmueble.descripcion}">
            <h3>📝 Descripción del inmueble:</h3>
            <p th:text="${inmueble.descripcion}"></p>
        </div>

        <div class="buttons">
            <a th:href="@{/propiedades}" class="btn">⬅ Volver al catálogo</a>
            <a th:href="@{/reservar/{id}(id=${inmueble.id})}" class="btn">📅 Reservar</a>
        </div>
    </div>
</body>
</html>
