<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Exitoso</title>
    <link rel="stylesheet" href="/css/result.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <div class="success-icon">✅</div>
                <h1>¡Registro Exitoso!</h1>
                <p>Tu cuenta ha sido creada correctamente</p>
            </div>
            
            <div class="content">
                <div class="user-info">
                    <div class="info-item">
                        <span class="info-label">ID de Usuario:</span>
                        <span class="info-value" th:text="${usuario.id}">123</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Nombre:</span>
                        <span class="info-value" th:text="${usuario.nombre}">Juan Pérez</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Email:</span>
                        <span class="info-value" th:text="${usuario.email}">juan@ejemplo.com</span>
                    </div>
                </div>
                
                <a th:href="@{/usuarios}" class="btn-primary">Registrar otro usuario</a>
                <a th:href="@{/}" class="btn-secondary">Ir al inicio</a>
            </div>
            
            <div class="footer">
                <p>¿Necesitas ayuda? <a href="#">Contáctanos</a></p>
            </div>
        </div>
    </div>
</body>
</html>
