<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Propiedad - Manteca SL</title>
    <!-- Lucide Icons para iconos -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link rel="stylesheet" href="/css/editar-propiedad.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>✏️ Editar Propiedad</h1>
                <p>Modifica los datos de tu alojamiento</p>
            </div>
            
            <div class="form-container">
                <!-- Mensaje de error -->
                <div th:if="${error}" class="error" th:text="${error}"></div>
                
                <form th:action="@{/actualizar-propiedad}" method="post" id="editPropertyForm">
                    <input type="hidden" name="id" th:value="${inmueble.id}">
                    
                    <!-- Dirección -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="calle">Calle</label>
                            <div class="input-with-icon">
                                <i data-lucide="map-pin" class="w-4 h-4"></i>
                                <input type="text" id="calle" name="calle" th:value="${inmueble.calle}"
                                    class="input-field" placeholder="Ej: Avenida del Sol" required>
                            </div>
                            <div class="field-helper">Nombre de la vía principal</div>
                        </div>

                        <div class="form-group">
                            <label for="numero">Número</label>
                            <input type="text" id="numero" name="numero" th:value="${inmueble.numero}"
                                class="input-field" placeholder="12B" required>
                            <div class="field-helper">Número y bloque si aplica</div>
                        </div>
                    </div>

                    <!-- Ciudad y Código Postal -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="ciudad">Ciudad</label>
                            <div class="input-with-icon">
                                <i data-lucide="building" class="w-4 h-4"></i>
                                <input type="text" id="ciudad" name="ciudad" th:value="${inmueble.ciudad}"
                                    class="input-field" placeholder="Madrid" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="codigoPostal">Código Postal</label>
                            <input type="text" id="codigoPostal" name="codigoPostal" th:value="${inmueble.codigoPostal}"
                                class="input-field" placeholder="28080" required>
                            <div class="field-helper">5 dígitos</div>
                        </div>
                    </div>

                    <!-- Precio -->
                    <div class="form-group">
                        <label for="precioNoche">Precio por Noche (€)</label>
                        <div class="input-with-icon">
                            <i data-lucide="euro" class="w-4 h-4"></i>
                            <input type="number" id="precioNoche" name="precioNoche" th:value="${inmueble.precioNoche}"
                                   class="input-field" placeholder="50.00" step="0.01" min="0" required>
                        </div>
                        <div class="field-helper">Precio por noche de estancia</div>
                    </div>

                    <!-- Capacidad -->
                    <div class="form-group">
                        <label for="capacidad">Capacidad (personas)</label>
                        <div class="input-with-icon">
                            <i data-lucide="users" class="w-4 h-4"></i>
                            <input type="number" id="capacidad" name="capacidad" th:value="${inmueble.capacidad}"
                                   class="input-field" placeholder="4" min="1" required>
                        </div>
                        <div class="field-helper">Máximo número de huéspedes</div>
                    </div>

                    <!-- Descripción -->
                    <div class="form-group">
                        <label for="descripcion" class="optional">Descripción de la Propiedad</label>
                        <div class="input-with-icon">
                            <i data-lucide="file-text" class="w-4 h-4" style="align-self: flex-start; margin-top: 14px;"></i>
                            <textarea id="descripcion" name="descripcion" 
                                      class="input-field" 
                                      placeholder="Describe tu propiedad, características, ambiente cercano, servicios incluidos..."
                                      th:text="${inmueble.descripcion}"
                                      rows="4"></textarea>
                        </div>
                        <div class="field-helper">Opcional - Describe lo que hace especial tu propiedad</div>
                    </div>

                    <!-- Botones de acción -->
                    <div class="form-group">
                        <button type="submit" class="btn-submit">
                            <i data-lucide="save" class="w-5 h-5"></i>
                            Actualizar Propiedad
                        </button>
                        <a th:href="@{/mis-propiedades}" class="btn-cancel">
                            <i data-lucide="x" class="w-5 h-5"></i>
                            Cancelar
                        </a>
                    </div>
                </form>
            </div>
            
            <!-- Footer con enlaces -->
            <div class="footer">
                <a th:href="@{/mis-propiedades}">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    Volver a Mis Propiedades
                </a>
                <span>|</span>
                <a th:href="@{/}">
                    <i data-lucide="home" class="w-4 h-4"></i>
                    Volver al inicio
                </a>
            </div>
        </div>
    </div>

    <script>
        // Inicializar iconos de Lucide
        document.addEventListener('DOMContentLoaded', function() {
            lucide.createIcons();
            
            // Validación del formulario
            const form = document.getElementById('editPropertyForm');
            if (form) {
                form.addEventListener('submit', function(e) {
                    const submitBtn = this.querySelector('.btn-submit');
                    if (submitBtn) {
                        submitBtn.classList.add('loading');
                        submitBtn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Actualizando...';
                        lucide.createIcons();
                    }
                });
            }
            
            // Formatear código postal
            const cpInput = document.getElementById('codigoPostal');
            if (cpInput) {
                cpInput.addEventListener('input', function() {
                    this.value = this.value.replace(/\D/g, '').substring(0, 5);
                });
            }
            
            // Formatear precio
            const priceInput = document.getElementById('precioNoche');
            if (priceInput) {
                priceInput.addEventListener('blur', function() {
                    if (this.value) {
                        this.value = parseFloat(this.value).toFixed(2);
                    }
                });
            }
            
            // Contador de caracteres para descripción
            const descTextarea = document.getElementById('descripcion');
            if (descTextarea) {
                const charCount = document.createElement('div');
                charCount.className = 'field-helper text-right';
                charCount.style.marginTop = '5px';
                descTextarea.parentNode.appendChild(charCount);
                
                function updateCharCount() {
                    const length = descTextarea.value.length;
                    charCount.textContent = `${length}/500 caracteres`;
                    if (length > 450) {
                        charCount.style.color = 'var(--warning-color)';
                    } else if (length > 400) {
                        charCount.style.color = 'var(--text-secondary)';
                    } else {
                        charCount.style.color = 'var(--text-secondary)';
                    }
                }
                
                descTextarea.addEventListener('input', updateCharCount);
                updateCharCount(); // Inicial
                
                // Limitar a 500 caracteres
                descTextarea.addEventListener('input', function() {
                    if (this.value.length > 500) {
                        this.value = this.value.substring(0, 500);
                    }
                });
            }
        });
    </script>
</body>
</html>
